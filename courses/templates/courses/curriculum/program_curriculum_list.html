{% extends "base.html" %}
{% block content %}

<div class="container mt-4">

  <!-- 🔹 헤더 카드 -->
  <div class="card shadow-sm mb-4">
    <div class="card-body d-flex justify-content-between align-items-center">
      <div>
        <h4 class="mb-1">
          <i class="bi bi-journal-text me-1 text-primary"></i>
          커리큘럼 프로그램 목록
        </h4>
        <small class="text-muted">
          수업에 사용될 커리큘럼 프로그램을 관리합니다
        </small>
      </div>

        {% if request.user.is_staff %}
            <a href="{% url 'curriculum_program_create' %}"
            class="btn btn-primary">
            <i class="bi bi-plus-circle me-1"></i>
            커리큘럼 등록
            </a>
        {% endif %}
    </div>
  </div>

  <!-- 🔹 필터 카드 -->
  <div class="card shadow-sm mb-4">
    <div class="card-body">
      <form id="filter-form" action="." method="GET">
        <div class="row align-items-center g-3">
          <div class="col-md-4">
            <label for="class_type_filter" class="form-label fw-bold">수업 유형</label>
            <select name="class_type" id="class_type_filter" class="form-select form-select-sm">
              <option value="">전체</option>
              {% for value, display in class_type_choices %}
                <option value="{{ value }}" {% if value == selected_class_type %}selected{% endif %}>{{ display }}</option>
              {% endfor %}
            </select>
          </div>
          <div class="col-md-8">
            <label class="form-label fw-bold d-block mb-2">수업 분야</label>
            <div class="btn-group flex-wrap gap-1" role="group">
              {% for subject in subjects %}
                <input type="checkbox" class="btn-check" name="subjects" value="{{ subject.id }}" id="subject_{{ subject.id }}" autocomplete="off" {% if subject.id in selected_subject_ids %}checked{% endif %}>
                <label class="btn btn-sm btn-outline-primary" for="subject_{{ subject.id }}">{{ subject.name }}</label>
              {% endfor %}
            </div>
          </div>
        </div>
      </form>
    </div>
  </div>

  <!-- 🔹 프로그램 리스트 (카드형) -->
  <div id="program-list-container" class="row g-4">
    {% include 'courses/curriculum/partials/program_list_partial.html' with programs=programs %}
  </div>

</div>

<script>
document.addEventListener('DOMContentLoaded', function () {
    const filterForm = document.getElementById('filter-form');
    const programListContainer = document.getElementById('program-list-container');

    filterForm.addEventListener('change', function (e) {
        const formData = new FormData(filterForm);
        const params = new URLSearchParams(formData);

        // Update URL in the browser's history
        history.pushState(null, '', `?${params.toString()}`);

        fetch(`?${params.toString()}`, {
            headers: {
                'X-Requested-With': 'XMLHttpRequest'
            }
        })
        .then(response => {
            if (!response.ok) {
                throw new Error('Network response was not ok');
            }
            return response.text();
        })
        .then(html => {
            programListContainer.innerHTML = html;
        })
        .catch(error => {
            console.error('Error fetching filtered programs:', error);
            programListContainer.innerHTML = '<div class="col-12"><div class="alert alert-danger">목록을 불러오는 데 실패했습니다.</div></div>';
        });
    });
});
</script>

{% endblock %}
