{% extends "base.html" %}
{% block content %}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card mt-5 shadow-sm">
                <div class="card-header text-center">
                    <h2 class="mb-0"><i class="bi bi-box-arrow-in-right me-2"></i>로그인</h2>
                </div>
                <div class="card-body p-4">
                    <form method="post" action="{% url 'login' %}">
                        {% csrf_token %}

                        {% if form.errors %}
                            <div class="alert alert-danger">
                                <strong>로그인 실패:</strong> 아이디 또는 비밀번호가 올바르지 않습니다.
                            </div>
                        {% endif %}
                        {% if messages %}
                            {% for message in messages %}
                                <div class="alert alert-success">{{ message }}</div>
                            {% endfor %}
                        {% endif %}

                        <div class="mb-3">
                            <label class="form-label">아이디</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-person"></i></span>
                                <input type="text" name="username" class="form-control">
                            </div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label">비밀번호</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-lock"></i></span>
                                <input type="password" name="password" class="form-control">
                            </div>
                        </div>

                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-primary btn-lg">
                                <i class="bi bi-box-arrow-in-right"></i> 로그인
                            </button>
                            <a href="{% url 'kakao_login' %}" class="btn btn-lg w-100" style="background-color: #FEE500; color: #000000; border: none;">
                                <i class="bi bi-chat-fill"></i> 카카오 로그인 / 회원가입
                            </a>
                        </div>
                    </form>
                </div>
            </div>

            <div class="text-center mt-4">
                <p class="text-muted">계정이 없으신가요?</p>
                <div class="d-flex justify-content-center gap-2">
                    <a class="btn btn-secondary" href="{% url 'signup' %}">
                        <i class="bi bi-person-plus"></i> 개인 회원가입
                    </a>
                    <a class="btn btn-success" href="{% url 'institution_signup' %}">
                        <i class="bi bi-building"></i> 기관 회원가입
                    </a>
                </div>
                <p class="mt-3">
                    <a href="{% url 'password_reset' %}">비밀번호를 잊으셨나요?</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
