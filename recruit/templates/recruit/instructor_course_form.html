{% extends "base.html" %}
{% load static %}

{% block content %}
<div class="container mt-5 pt-3">
  <div class="row justify-content-center">
    <div class="col-md-10">
      <div class="card border-0 shadow-sm">
        <div class="card-header bg-white border-bottom py-3">
          <h5 class="fw-bold mb-0">{% if course %}지도사과정 수정{% else %}지도사과정 등록{% endif %}</h5>
        </div>
        <div class="card-body p-4">
          <form method="post">
            {% csrf_token %}
            <div class="mb-4">
              <label class="form-label fw-bold">과정명</label>
              <input type="text" name="name" class="form-control" value="{{ course.name|default:'' }}" placeholder="예) 로봇코딩지도사 1급" required>
            </div>
            
            <div class="mb-4">
              <label class="form-label fw-bold">과정 소개</label>
              <textarea name="course_intro" class="form-control" rows="4" placeholder="과정에 대한 전반적인 소개를 적어주세요.">{{ course.course_intro|default:'' }}</textarea>
            </div>
            
            <div class="mb-4">
              <label class="form-label fw-bold">교육 목표</label>
              <textarea name="educational_goal" class="form-control" rows="4" placeholder="이 과정을 통해 달성하고자 하는 교육 목표를 적어주세요.">{{ course.educational_goal|default:'' }}</textarea>
            </div>

            <div class="mb-4">
              <label class="form-label fw-bold d-flex justify-content-between align-items-center">
                커리큘럼 (차시별 내용)
                <button type="button" class="btn btn-sm btn-outline-primary" onclick="addCurriculumRow()">
                  <i class="bi bi-plus"></i> 차시 추가
                </button>
              </label>
              <table class="table table-bordered align-middle text-center" id="curriculumTable">
                <thead class="table-light">
                  <tr>
                    <th style="width: 15%">차시</th>
                    <th style="width: 60%">내용</th>
                    <th style="width: 15%">시간</th>
                    <th style="width: 10%">삭제</th>
                  </tr>
                </thead>
                <tbody id="curriculumBody">
                  {% if course and course.curriculum %}
                    {% for item in course.curriculum %}
                    <tr>
                      <td><input type="text" name="curriculum_session" class="form-control form-control-sm" value="{{ item.session }}"></td>
                      <td><input type="text" name="curriculum_content" class="form-control form-control-sm" value="{{ item.content }}"></td>
                      <td><input type="text" name="curriculum_time" class="form-control form-control-sm" value="{{ item.time }}"></td>
                      <td><button type="button" class="btn btn-sm btn-danger" onclick="this.closest('tr').remove()"><i class="bi bi-trash"></i></button></td>
                    </tr>
                    {% endfor %}
                  {% else %}
                    <tr>
                      <td><input type="text" name="curriculum_session" class="form-control form-control-sm" placeholder="예: 1차시"></td>
                      <td><input type="text" name="curriculum_content" class="form-control form-control-sm" placeholder="교육 내용"></td>
                      <td><input type="text" name="curriculum_time" class="form-control form-control-sm" placeholder="예: 2시간"></td>
                      <td><button type="button" class="btn btn-sm btn-danger" onclick="this.closest('tr').remove()"><i class="bi bi-trash"></i></button></td>
                    </tr>
                  {% endif %}
                </tbody>
              </table>
            </div>

            <div class="row mb-4">
              <div class="col-md-6">
                <label class="form-label fw-bold">발급기관</label>
                <input type="text" name="certificate_agency" id="id_certificate_agency" class="form-control" value="{{ course.certificate_agency|default:'' }}" placeholder="예) 대한로봇코딩협회">
              </div>
              <div class="col-md-6">
                <label class="form-label fw-bold">자격증 종류</label>
                <select name="certificate_type" id="id_certificate_type" class="form-select">
                  <option value="none" {% if course.certificate_type == 'none' %}selected{% endif %}>해당없음/수료증</option>
                  <option value="national" {% if course.certificate_type == 'national' %}selected{% endif %}>국가자격</option>
                  <option value="authorized" {% if course.certificate_type == 'authorized' %}selected{% endif %}>국가공인</option>
                  <option value="private" {% if course.certificate_type == 'private' %}selected{% endif %}>민간자격</option>
                </select>
              </div>
            </div>

            <div class="mb-4">
              <label class="form-label fw-bold d-flex align-items-center">
                비용 안내
                <div class="form-check ms-3 mb-0 fw-normal">
                  <input class="form-check-input" type="checkbox" name="cost_includes_all" id="id_cost_includes_all" {% if course.cost_includes_all %}checked{% endif %}>
                  <label class="form-check-label text-primary" for="id_cost_includes_all">
                    교육비에 자격발급비, 교재/교구비 포함
                  </label>
                </div>
              </label>
              <div class="row g-3">
                <div class="col-md-4">
                  <div class="input-group">
                    <span class="input-group-text">교육비</span>
                    <input type="text" name="cost_education" id="id_cost_education" class="form-control number-format text-end" value="{{ course.cost_education|default:0 }}" required>
                    <span class="input-group-text">원</span>
                  </div>
                </div>
                <div class="col-md-4">
                  <div class="input-group">
                    <span class="input-group-text">자격발급비</span>
                    <input type="text" name="cost_certificate" id="id_cost_certificate" class="form-control number-format text-end" value="{{ course.cost_certificate|default:0 }}">
                    <span class="input-group-text">원</span>
                  </div>
                </div>
                <div class="col-md-4">
                  <div class="input-group">
                    <span class="input-group-text">교재/교구비</span>
                    <input type="text" name="cost_material" id="id_cost_material" class="form-control number-format text-end" value="{{ course.cost_material|default:0 }}">
                    <span class="input-group-text">원</span>
                  </div>
                </div>
              </div>
            </div>
            
            <div class="d-flex justify-content-between mt-5">
              <a href="{% url 'instructor_course_list' %}" class="btn btn-secondary px-4">취소</a>
              <button type="submit" class="btn btn-primary px-5">저장</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
function addCurriculumRow() {
    const tbody = document.getElementById('curriculumBody');
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td><input type="text" name="curriculum_session" class="form-control form-control-sm" placeholder="예: N차시"></td>
      <td><input type="text" name="curriculum_content" class="form-control form-control-sm" placeholder="교육 내용"></td>
      <td><input type="text" name="curriculum_time" class="form-control form-control-sm" placeholder="예: 2시간"></td>
      <td><button type="button" class="btn btn-sm btn-danger" onclick="this.closest('tr').remove()"><i class="bi bi-trash"></i></button></td>
    `;
    tbody.appendChild(tr);
}

document.addEventListener('DOMContentLoaded', function() {
    const checkbox = document.getElementById('id_cost_includes_all');
    const certInput = document.getElementById('id_cost_certificate');
    const matInput = document.getElementById('id_cost_material');

    function toggleCostInputs() {
        if (checkbox.checked) {
            certInput.value = '0';
            matInput.value = '0';
            certInput.setAttribute('readonly', 'readonly');
            matInput.setAttribute('readonly', 'readonly');
            certInput.classList.add('bg-light');
            matInput.classList.add('bg-light');
        } else {
            certInput.removeAttribute('readonly');
            matInput.removeAttribute('readonly');
            certInput.classList.remove('bg-light');
            matInput.classList.remove('bg-light');
        }
    }

    checkbox.addEventListener('change', toggleCostInputs);
    toggleCostInputs(); // 초기 상태 반영

    // 숫자 콤마 포맷팅 함수
    function formatNumberWithCommas(value) {
        let numStr = value.replace(/[^0-9]/g, '');
        if (!numStr) return '0';
        return parseInt(numStr, 10).toLocaleString('en-US');
    }

    // 입력 필드 포맷팅 적용
    document.querySelectorAll('.number-format').forEach(function(input) {
        // 초기 렌더링 시 포맷팅
        input.value = formatNumberWithCommas(input.value);

        input.addEventListener('input', function(e) {
            let cursorPosition = this.selectionStart;
            let originalLength = this.value.length;
            
            this.value = formatNumberWithCommas(this.value);
            
            let newLength = this.value.length;
            cursorPosition = cursorPosition + (newLength - originalLength);
            this.setSelectionRange(cursorPosition, cursorPosition);
        });
        
        input.addEventListener('focus', function(e) {
            if (this.value === '0') this.value = '';
        });
        
        input.addEventListener('blur', function(e) {
            if (this.value === '') this.value = '0';
        });
    });

    // Textarea 자동 높이 조절
    function autoResizeTextarea(el) {
        el.style.height = 'auto';
        el.style.height = el.scrollHeight + 'px';
    }

    document.querySelectorAll('textarea').forEach(ta => {
        ta.addEventListener('input', function() {
            autoResizeTextarea(this);
        });
        // 초기 렌더링 시점에 내용이 있으면 높이 조절
        if(ta.value) {
            autoResizeTextarea(ta);
        }
    });
});
</script>
{% endblock %}
